name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  links:
    name: relative links and headings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every relative link and image points to a file and heading that exist
        run: python .github/scripts/check_links.py
